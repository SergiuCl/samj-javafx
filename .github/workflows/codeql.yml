name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [ "codeql-testing" ]
  pull_request:
    branches: [ "codeql-testing" ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    # 	1.	Checkout → get code
    #	2.	Init → configure CodeQL + language
    #	3.	Build → create CodeQL database
    #	4.	Analyze → run queries on that database
    steps:
      # Clones your repository into the runner VM
      # Makes your source code available to later steps
      - name: Checkout
        uses: actions/checkout@v4

      # Downloads the CodeQL engine
      # Selects the Java analyzer
      # Prepares query suites (default security queries)
      # Sets up environment hooks to observe the build
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java

      # Automatically detects how to build your project
      # Runs something like:
      #	•	mvn package
      #	•	gradle build
      #	•	ant, etc.
      # During this step, CodeQL:
      #	•	observes compilation
      #	•	builds its CodeQL database
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # Runs the selected CodeQL query suite
      #	•	Executes dataflow / taint-tracking queries
      #	•	Produces results in SARIF
      #	•	Uploads results to GitHub Code Scanning
      - name: Analyze
        uses: github/codeql-action/analyze@v4