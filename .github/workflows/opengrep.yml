name: Opengrep Analyze

on:
  workflow_dispatch:
  push:
    branches: [ "main", "opengrep-testing" ]
  pull_request:
    branches: [ "main", "opengrep-testing" ]

jobs:
  opengrep-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required to upload results to the Security tab

    steps:
      - uses: actions/checkout@v4

      - name: Install Opengrep
        run: |
          curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
          opengrep --version

      - name: Run Opengrep Scan (SARIF)
        run: |
          opengrep scan --config auto --sarif-output opengrep.sarif .

      - name: Upload to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: opengrep.sarif
        if: always()

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengrep-sarif
          path: opengrep.sarif
        if: always()