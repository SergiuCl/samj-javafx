name: Opengrep Analyze

on:
  workflow_dispatch:
  push:
    branches: [ "main", "opengrep-testing" ]
  pull_request:
    branches: [ "main", "opengrep-testing" ]

jobs:
  opengrep-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required to upload results to the Security tab

    container:
      # Using the official Opengrep image from the consortium
      image: ghcr.io/opengrep/opengrep:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Opengrep Scan
        run: |
          opengrep scan --config auto --sarif --output opengrep.sarif

      - name: Upload to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: opengrep.sarif
        if: always()

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengrep-sarif
          path: opengrep.sarif
        if: always()